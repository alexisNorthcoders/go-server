# http-level settings for the Pi's nginx. Install as /etc/nginx/conf.d/limits.conf.

# Don't advertise the nginx version.
server_tokens off;

# Rate limits for the public forms (zigzag scores, the portfolio contact form).
# Only POSTs count: a GET has an empty key, which nginx does not limit.
map $request_method $form_post_client {
    POST    $binary_remote_addr;
    default "";
}
map $request_method $form_post_any {
    POST    "all";
    default "";
}
limit_req_zone $form_post_client zone=forms_per_ip:10m rate=6r/m;
limit_req_zone $form_post_any    zone=forms_global:1m  rate=60r/m;
limit_req_status 429;
