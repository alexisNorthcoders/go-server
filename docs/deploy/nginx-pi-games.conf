# The two public games, and the zigzag score API on go-server (go-server-dev on
# the Pi, port 8080). Each game serves only its page and the files it loads;
# anything else under its path is not found, so notes, tests, logs and .git
# never leave the Pi.
#
# Install: /etc/nginx/snippets/pi-games.conf, included in the public
# alexisraspberry.duckdns.org server block and in the LAN port-80 block.
# Needs nginx-limits.conf (conf.d) for the forms zones and
# nginx-security-headers.conf (snippets) for the headers.

# --- Zigzag ---------------------------------------------------------------

location = /zigzag { return 301 /zigzag/; }
location = /zigzag/ { rewrite ^ /zigzag/index.html last; }

location = /zigzag/index.html {
    alias /home/alexis/Projects/zigzag-game/index.html;
    include snippets/security-headers.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/zigzag/([\w-]+\.js)$ {
    alias /home/alexis/Projects/zigzag-game/$1;
    include snippets/security-headers.conf;
}

location = /zigzag/score {
    limit_req zone=forms_per_ip burst=3 nodelay;
    limit_req zone=forms_global burst=20 nodelay;
    client_max_body_size 1k;

    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /zigzag/ { return 404; }

# --- Kings and Pigs -------------------------------------------------------

location = /kings-and-pigs { return 301 /kings-and-pigs/; }
location = /kings-and-pigs/ { rewrite ^ /kings-and-pigs/index.html last; }

# Pages must pick up new releases at once; assets rarely change.
location = /kings-and-pigs/index.html {
    alias /home/alexis/Projects/Platformer-Game/index.html;
    include snippets/security-headers.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# index.js, and the game's asset folders, by file type. No path segment may
# start with a dot.
location ~ "^/kings-and-pigs/(index\.js|(?:js|config|Sprites|img|sounds|fonts)/(?:[^/.][^/]*/)*[^/.][^/]*\.(?:js|mjs|json|png|wav|ttf))$" {
    alias /home/alexis/Projects/Platformer-Game/$1;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
}

location /kings-and-pigs/ { return 404; }
