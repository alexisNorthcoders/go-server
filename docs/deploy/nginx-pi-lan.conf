# Pages for the LAN only (http://raspberrypi.local/...). Install as
# /etc/nginx/snippets/pi-lan.conf and include it only in the port-80
# default_server block, never in the public server block.

location = /monitor-canvas { return 301 /monitor-canvas/; }
location = /monitor-canvas/ { rewrite ^ /monitor-canvas/index.html last; }

location = /monitor-canvas/index.html {
    alias /home/alexis/Projects/monitor-canvas/index.html;
    add_header Cache-Control "no-cache" always;
}

location = /monitor-canvas/main.js {
    alias /home/alexis/Projects/monitor-canvas/main.js;
}

location /monitor-canvas/ { return 404; }
