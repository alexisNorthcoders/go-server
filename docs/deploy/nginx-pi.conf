# nginx on the Raspberry Pi: the static games, and the zigzag score API that
# go-server (go-server-dev on the Pi) answers on port 8080. These replace the /snake, /zigzag and
# /kings-and-pigs locations that pointed at the old Node webserver.
#
# Goes in the alexisraspberry.duckdns.org server block (public) and the
# default port-80 server block (LAN, http://raspberrypi.local/...).

    # The game folders are git checkouts: never serve .git or other dotfiles.
    location ~ ^/(zigzag|monitor-canvas|kings-and-pigs)/(.*/)?\. {
        return 404;
    }

    location = /zigzag/score {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /zigzag { return 301 /zigzag/; }
    location /zigzag/ {
        alias /home/alexis/Projects/zigzag-game/;
    }

    location = /monitor-canvas { return 301 /monitor-canvas/; }
    location /monitor-canvas/ {
        alias /home/alexis/Projects/monitor-canvas/;
    }

    # Pages must pick up new releases at once; assets rarely change.
    location = /kings-and-pigs { return 301 /kings-and-pigs/; }
    location ~ ^/kings-and-pigs/((.*/)?([^/]*\.html)?)$ {
        alias /home/alexis/Projects/Platformer-Game/$1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /kings-and-pigs/ {
        alias /home/alexis/Projects/Platformer-Game/;
        add_header Cache-Control "public, max-age=604800";
    }
