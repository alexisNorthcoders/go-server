# Response headers for the public site. Install as
# /etc/nginx/snippets/security-headers.conf and include it at server level and
# in every location that sets its own add_header: a location with any
# add_header drops the server's ones.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
