openapi: 3.0.0
info:
  title: Pi API
  description: The endpoints go-server took over from the Raspberry Pi's old Node webserver.
  version: 1.0.0
servers:
  - url: http://raspberrypi.local:8080
    description: Raspberry Pi

paths:
  /monitor/stream:
    get:
      summary: Live snapshot of the Pi
      description: >
        Server-sent events. Each event is a JSON snapshot: the newest reading
        (taken every 5 seconds), the host, and every service's state (checked
        every 30 seconds). Sent at connect and after every reading and check.
      responses:
        '200':
          description: Stream of snapshots
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  sample:
                    $ref: '#/components/schemas/Sample'
                  host:
                    type: object
                    properties:
                      hostname: { type: string }
                      kernel: { type: string }
                      cores: { type: integer }
                      uptime: { type: number, description: Seconds since boot }
                      ports: { type: array, items: { type: integer }, description: TCP ports listening on every address }
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
  /monitor/history:
    get:
      summary: Readings over a time range, in columns
      description: >
        Up to 15 minutes comes from the 5-second readings in memory (tier
        "live"). Longer ranges come from the finest stored tier that covers
        them: per-minute readings (48 hours), 5-minute rollups (30 days) or
        hourly rollups (2 years). Rollups also carry each metric's peak as
        "<metric>_max". Unknown values are null.
      parameters:
        - name: range
          in: query
          required: false
          description: A number and a unit (m, h, d or y), at most 2y.
          schema: { type: string, default: 1h, example: 7d }
      responses:
        '200':
          description: The readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { type: string, enum: [live, samples, rollup_5m, rollup_1h] }
                  step: { type: integer, description: Seconds between readings }
                  ts: { type: array, items: { type: integer }, description: Unix seconds }
                  series:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: number, nullable: true }
        '400':
          description: The range could not be read
  /monitor/events:
    get:
      summary: Service status changes, newest first
      description: A change is recorded once the new status has held for two checks in a row. Kept 90 days.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        '200':
          description: The changes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ts: { type: integer }
                    group: { type: string }
                    name: { type: string }
                    status: { type: string, enum: [up, warn, down, stopped] }
                    detail: { type: string }
  /monitor/storage:
    get:
      summary: How much monitoring history is stored
      responses:
        '200':
          description: The metrics database's size and each table's rows against what it holds when full
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  file_bytes: { type: integer }
                  wal_bytes: { type: integer }
                  free_bytes: { type: integer }
                  tables:
                    type: array
                    items:
                      type: object
                      properties:
                        table: { type: string }
                        step: { type: integer }
                        rows: { type: integer }
                        capacity: { type: integer }
                        retention: { type: integer }
                        oldest: { type: integer, nullable: true }
                        newest: { type: integer, nullable: true }
  /zigzag/score:
    post:
      summary: Add Zigzag Game Highscore
      description: Accepts the score of the Zigzag game and adds it to the highscore list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              properties:
                score:
                  type: integer
                  description: The score to be added to the highscore list
                  example: 250
      responses:
        '201':
          description: Highscore added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Highscore added: 250"
        '400':
          description: Bad request - Score is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Score is required"
        '500':
          description: Internal server error - Error adding score
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error adding score"
    get:
      summary: Get the top 10 Zigzag scores
      description: Returns the 10 best scores in ascending order, so the high score is last.
      responses:
        "200":
          description: Successful response with the last 10 high scores.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    score:
                      type: integer
                      example: 19134
                    timestamp:
                      type: string
                      format: date-time
                      example: "2025-01-25T10:35:25.524Z"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /amazon-prices:
    post:
      summary: Record an Amazon price
      description: Local only. Called by amazon-scraper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, title, price, timestamp]
              properties:
                url: { type: string, example: "https://www.amazon.co.uk/dp/B01D8KOZF4" }
                title: { type: string, example: "ELEGOO UNO R3 Project Super Starter Kit" }
                price: { type: string, example: "£42.99" }
                timestamp: { type: string, format: date-time, example: "2026-09-06T10:34:33.896Z" }
      responses:
        '201':
          description: Price recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Price recorded" }
                  id: { type: integer, example: 94795 }
        '400': { description: Missing required fields }
        '403': { description: Not called from this machine }
        '500': { description: Failed to insert price record }
  /amazon-prices/last:
    get:
      summary: Get the last recorded price for a product
      description: Local only.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The newest price, or null when none is recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  lastPrice: { type: string, nullable: true, example: "£42.99" }
        '400': { description: Missing URL }
        '403': { description: Not called from this machine }
        '500': { description: Failed to get last price }
components:
  schemas:
    Sample:
      type: object
      description: One reading. Rates are averages since the previous reading; unknown values are null.
      properties:
        ts: { type: integer, description: Unix seconds }
        cpu: { type: number, nullable: true, description: Percent busy }
        temp: { type: number, nullable: true, description: °C }
        load1: { type: number, nullable: true }
        mem_used: { type: number, nullable: true, description: MiB, total minus available }
        mem_total: { type: number, nullable: true, description: MiB }
        swap_used: { type: number, nullable: true, description: MiB }
        disk_used: { type: number, nullable: true, description: GiB on / }
        disk_total: { type: number, nullable: true, description: GiB on / }
        disk_read: { type: number, nullable: true, description: kB/s }
        disk_write: { type: number, nullable: true, description: kB/s }
        net_rx: { type: number, nullable: true, description: kB/s }
        net_tx: { type: number, nullable: true, description: kB/s }
    Service:
      type: object
      properties:
        group: { type: string, enum: [system, pm2, docker, redis, database] }
        name: { type: string }
        status: { type: string, enum: [up, warn, down, stopped], description: Stopped is turned off on purpose, not an alarm }
        detail: { type: string }
        cpu: { type: number, description: Percent (pm2 only) }
        mem_mb: { type: number, description: MiB (pm2 and redis) }
        restarts: { type: integer, description: pm2 only }
        since: { type: integer, description: Unix seconds it has been in this state }
        stats: { type: object, additionalProperties: { type: string } }
